name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  docs:
    name: docs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Install Sphinx and extensions
        run: pip install -r requirements-docs.txt
      - name: Build the documentation (warnings are errors)
        run: sphinx-build -W -b html docs build/docs
